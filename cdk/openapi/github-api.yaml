openapi: 3.0.3
info:
  title: GitHub API (Minimal subset for AgentCore Gateway)
  version: "2022-11-28"
  description: |
    Minimal OpenAPI spec for GitHub API, targeting AgentCore Gateway 3LO verification.
    Covers: repos, issues, pull requests, search, user.

servers:
  - url: https://api.github.com

security:
  - bearer: []

paths:
  /user:
    get:
      operationId: getAuthenticatedUser
      summary: Get the authenticated user
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                type: object

  /user/repos:
    get:
      operationId: listUserRepos
      summary: List repositories for the authenticated user
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: sort
          in: query
          schema:
            type: string
            enum: [created, updated, pushed, full_name]
            default: full_name
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /repos/{owner}/{repo}:
    get:
      operationId: getRepo
      summary: Get a repository
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                type: object

  /repos/{owner}/{repo}/issues:
    get:
      operationId: listRepoIssues
      summary: List issues for a repository
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /repos/{owner}/{repo}/pulls:
    get:
      operationId: listRepoPullRequests
      summary: List pull requests for a repository
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
            default: open
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: List of pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /search/repositories:
    get:
      operationId: searchRepositories
      summary: Search repositories
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: sort
          in: query
          schema:
            type: string
            enum: [stars, forks, help-wanted-issues, updated]
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object

  /search/issues:
    get:
      operationId: searchIssues
      summary: Search issues and pull requests
      parameters:
        - $ref: "#/components/parameters/GitHubApiVersion"
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: sort
          in: query
          schema:
            type: string
            enum: [comments, reactions, created, updated]
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    GitHubApiVersion:
      name: X-GitHub-Api-Version
      in: header
      schema:
        type: string
        default: "2022-11-28"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
